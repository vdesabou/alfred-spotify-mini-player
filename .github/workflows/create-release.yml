
name: Create Release

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  milestone:
    types: [closed]


jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      # issues need to be closed to generate release notes
      - name: Close issues
        id: close_issues
        uses: lee-dohm/close-matching-issues@v2
        with:
          query: "milestone:${{ github.event.milestone.title }}"
          token: ${{ secrets.GITHUB_TOKEN }}
      # The issue list lags a few seconds behind the close above: querying it right away
      # returns no closed issues and empty release notes (v-14.5 run, 3 s after the close).
      - name: Wait for closed issues to be visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          number="${{ github.event.milestone.number }}"
          for i in $(seq 1 30); do
            open=$(gh api "repos/$repo/issues?milestone=$number&state=open&per_page=100" --jq 'length')
            closed=$(gh api "repos/$repo/issues?milestone=$number&state=closed&per_page=100" --jq 'length')
            if [ "$open" -eq 0 ] && [ "$closed" -gt 0 ]; then
              echo "$closed closed issue(s) visible"
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo "::warning::closed issues of milestone $number are still not visible, release notes may be empty"
      # Maintained fork: fixes HTTP 422 when the milestone's issues are paginated
      # (this repo now has 660+ issues), which produced empty release notes
      # (v-13.11, v-14.3, v-14.4). MILESTONE_NUMBER comes from the milestone event.
      - name: Create Release Notes
        uses: vdesabou/release-notes-generator-action@1.0.4
        id: Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FOLDER: temp_release_notes
          MILESTONE_NUMBER: ${{ github.event.milestone.number }}
      # do not bump the version, publish a release or open a Gallery issue with empty notes
      - name: Check release notes are not empty
        run: |
          if ! grep -q '[^[:space:]]' ./temp_release_notes/release_file.md 2>/dev/null; then
            echo "::error::release notes are empty: make sure milestone ${{ github.event.milestone.title }} has issues labelled bug or enhancement, then re-run this job"
            exit 1
          fi
          cat ./temp_release_notes/release_file.md
      - name: Read temp_release_notes/release_file.md
        id: read_release_file
        uses: juliangruber/read-file-action@v1
        with:
          path: ./temp_release_notes/release_file.md
      - name: Update version in plist
        run: |
          sed "/version/{n;s/<string>[0-9]*\.[0-9]*<\/string>/<string>${{ github.event.milestone.title }}<\/string>/g}" ./spotify-mini-player/info.plist > ./spotify-mini-player/info.plist.tmp
          mv ./spotify-mini-player/info.plist.tmp ./spotify-mini-player/info.plist
      - name: push
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-branch: 'master'
          commit-message: 'updating version'
          files: ./spotify-mini-player/info.plist
          name: Vincent de Saboulin
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v-${{ github.event.milestone.title }}
          release_name: Version ${{ github.event.milestone.title }}
          body: |
            ${{ steps.read_release_file.outputs.content }}
          draft: false
          prerelease: false
      - name: Build project # This would actually build your project, using zip for an example artifact
        run: |
          cd ./spotify-mini-player && zip -r ../spotifyminiplayer.alfredworkflow * -x \*.git\* -x \*.zip\* -x \*.idraw\* -x \temp_release_notes.*\* -x \composer.*\* -x vendor/jwilsson/spotify-web-api-[...]
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./spotifyminiplayer.alfredworkflow
          asset_name: spotifyminiplayer.alfredworkflow
          asset_content_type: application/zip
      # Gallery reviewers want the Changelog field in a ```changelog block (the issue form
      # renders it that way) and written for users, not as bug reports (gallery-edits #587, #588).
      # Write the user-facing changelog in the milestone description, one change per line;
      # without one, fall back to the issue titles, with "Fix:" added to bug fixes.
      - name: Create Gallery update issue
        env:
          GH_TOKEN: ${{ secrets.GH_GALLERY_TOKEN }}
          MILESTONE_DESCRIPTION: ${{ github.event.milestone.description }}
          MILESTONE_TITLE: ${{ github.event.milestone.title }}
        run: |
          strip_noise() {
            sed -E \
              -e 's/[[:space:]]+\[[^]]+\]\([^)]*\)//g' \
              -e 's/[[:space:]]+\(#[0-9]+\)//g' \
              -e 's/[[:space:]]+following[[:space:]]+#[0-9]+//g' \
              -e 's/[[:space:]]+#([0-9]+)//g' | \
              perl -CSD -pe 's/[\p{So}\p{Emoji_Modifier}\x{FE0F}\x{200D}]//g; s/^\s+|\s+$//g; $_ .= "\n"'
          }
          if printf '%s' "$MILESTONE_DESCRIPTION" | grep -q '[^[:space:]]'; then
            gallery_changelog=$(printf '%s\n' "$MILESTONE_DESCRIPTION" | tr -d '\r' | \
              sed -E -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*[-*][[:space:]]+//' | \
              strip_noise | sed -E '/^$/d; s/^/* /')
          else
            echo "::warning::milestone $MILESTONE_TITLE has no description: the Gallery changelog uses the issue titles"
            gallery_changelog=$(awk '
                /^#/ { fix = (tolower($0) ~ /bug|fix/) ; next }
                /^[[:space:]]*[-*][[:space:]]/ {
                  sub(/^[[:space:]]*[-*][[:space:]]+/, "")
                  print (fix ? "Fix: " : "") $0
                }' ./temp_release_notes/release_file.md | \
              strip_noise | sed -E '/^$/d; s/^/* /')
          fi
          fence='```'
          {
            echo '### Gallery URL'
            echo 'https://alfred.app/workflows/vdesabou/spotify-mini-player/'
            echo
            echo '### New Version'
            echo "$MILESTONE_TITLE"
            echo
            echo '### Changelog'
            echo
            echo "${fence}changelog"
            echo "$gallery_changelog"
            echo "$fence"
            echo
            echo '### Notes'
            echo "Release: https://github.com/vdesabou/alfred-spotify-mini-player/releases/tag/v-$MILESTONE_TITLE"
          } > gallery-issue.md
          cat gallery-issue.md

          gh issue create \
            --repo alfredapp/gallery-edits \
            --title "Update Workflow: vdesabou/spotify-mini-player" \
            --body-file gallery-issue.md
